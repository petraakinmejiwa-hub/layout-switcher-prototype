<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffdb01">
  <title>Layout Switcher Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* FTN Dark tokens from the Figma file */
      --brand: #ffdb01;
      --background-base: #17171b;
      --surface-primary: #3b3b44;
      --surface-secondary: #2e2e38;
      --surface-action: #58585f;
      --content-primary: #ffffff;
      --content-secondary: #d0d0d2;
      --content-disabled: #bbbbbe;
      --content-live: #17cf2f;
      --negative: #d01111;
      --accent-lime: #c8e651;
      --odd-surface: rgba(255, 255, 255, .1);
      --odd-surface-hover: rgba(255, 255, 255, .15);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --ease-out: cubic-bezier(.22, 1, .36, 1);
    }
    @supports (transition-timing-function: linear(0, 1)) {
      /* Approximates Figma's "Gentle" spring used on the layout button */
      :root {
        --spring: linear(0, .009, .035 2.1%, .141 4.4%, .723 12.9%, .938 16.7%, 1.017 19.7%, 1.067, 1.088 24.9%, 1.091 26.6%, 1.073 30.2%, 1.006 39.8%, .989 45%, .993 55.3%, 1);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Roboto, system-ui, sans-serif;
      color: var(--content-primary);
      background: radial-gradient(circle at 50% 0%, #2a2a33 0%, #101013 70%);
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
    img { display: block; }
    p { margin: 0; }

    /* ---------- Device frame ---------- */
    .phone {
      position: relative;
      width: 375px;
      height: min(935px, calc(100dvh - 32px));
      background: var(--background-base);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 0 10px #050506, 0 30px 80px rgba(0, 0, 0, .55);
      isolation: isolate;
    }
    @media (max-width: 440px) {
      body { display: block; background: var(--background-base); }
      .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
    }

    /* ---------- Top header (PA Top_header 0.1) ---------- */
    .top-header {
      position: absolute; inset: 0 0 auto 0; z-index: 20; height: 74px;
      background: var(--brand);
      display: flex; flex-direction: column; justify-content: center; gap: 10px;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .12));
    }
    .status-bar { position: relative; height: 20px; color: #000; font-size: 12px; line-height: 16px; }
    .status-bar .time { position: absolute; left: 50%; top: 3px; transform: translateX(-50%); }
    .status-left { position: absolute; left: 4px; top: 3px; display: flex; gap: 4px; align-items: flex-start; letter-spacing: -.05px; }
    .status-right { position: absolute; right: 5.5px; top: 3px; height: 16px; width: 92px; }
    .status-right .battery { position: absolute; right: 0; top: 1.5px; width: 26.5px; height: 11.5px; }
    .status-right .pct { position: absolute; right: 29.5px; top: .3px; }
    .status-right .alarm { position: absolute; right: 76.5px; top: 0; width: 14px; height: 14px; }
    .status-right .bt { position: absolute; right: 61.5px; top: 0; width: 14px; height: 14px; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 2px 8px; }
    .logo { width: 126.5px; height: 32px; position: relative; }
    .logo img { position: absolute; left: 2.77%; right: 2.37%; top: 0; height: 100%; width: auto; }
    .header-actions { display: flex; align-items: center; }
    .icon-touch { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; transition: background .15s; }
    .icon-touch:active { background: rgba(0, 0, 0, .08); }
    .account { position: relative; width: 48px; height: 40px; display: grid; justify-items: center; padding-top: 4px; }
    .account .balance { position: absolute; top: 26px; font-size: 10px; line-height: 12px; font-weight: 700; color: #000; white-space: nowrap; }

    /* ---------- Scroll area ---------- */
    .scroll {
      position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
      padding: 85px 0 64px; overscroll-behavior-y: contain;
      scrollbar-width: thin; scrollbar-color: #58585f transparent;
    }
    .scroll::-webkit-scrollbar { width: 6px; }
    .scroll::-webkit-scrollbar-thumb { background: #58585f; border-radius: 3px; }
    .h-scroll { display: flex; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .h-scroll > * { flex: none; scroll-snap-align: start; }

    /* ---------- Herobanners ---------- */
    .herobanners { gap: 8px; padding: 4px 8px; scroll-padding-left: 8px; }
    .hb { width: 180px; overflow: hidden; display: flex; flex-direction: column; text-align: left; }
    .hb-default { border-radius: 8px; }
    .hb-small { border-radius: 4px; }
    .hb-live { background: var(--brand); border: 1px solid var(--brand); }
    .hb-asset { position: relative; height: 76px; display: flex; align-items: flex-start; isolation: isolate; overflow: hidden; }
    .hb-asset > .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    .hb-asset > .bg-live { position: absolute; left: 0; top: -55.77%; width: 137.22%; height: 166.4%; max-width: none; z-index: -1; }
    .hb-headline {
      width: 120px; height: 76px; padding: 6px 2px 6px 6px; display: flex; flex-direction: column; gap: 4px;
      font-size: 12px; font-weight: 700; font-style: italic; letter-spacing: .3px; text-transform: uppercase; line-height: normal;
    }
    .hb-headline .sub { font-weight: 400; }
    .hb-headline .grow { flex: 1; }
    .hb-player { width: 60px; height: 76px; display: flex; align-items: flex-end; }
    .hb-player .crop { position: relative; width: 60px; height: 74px; overflow: hidden; }
    .hb-player .crop img { position: absolute; left: -16.65%; top: -1.14%; width: 123.72%; height: 102.27%; max-width: none; }
    .odds-pair { display: flex; gap: 2px; align-items: flex-end; }
    .old-odds, .new-odds { border-radius: 4px; padding: 2px 4px; color: #000; filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .5)); white-space: nowrap; }
    .old-odds { background: var(--content-disabled); font-size: 10px; line-height: 10px; font-weight: 600; font-style: italic; letter-spacing: .3px; text-decoration: line-through; }
    .new-odds { background: var(--brand); font-size: 12px; font-weight: 700; font-style: normal; letter-spacing: -.24px; }
    .hb-bottom {
      height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 6px 6px;
      font-size: 12px; font-weight: 700; letter-spacing: .3px; line-height: 1; white-space: nowrap;
      transition: background .3s var(--ease-out), color .3s var(--ease-out);
    }
    .hb-bottom-grey { background: var(--surface-action); padding: 6px; }
    .hb-bottom-dark { background: rgba(0, 0, 0, .5); }
    .hb-bottom-brand, .hb.is-selected .hb-bottom-dark { background: var(--brand); color: #000; }
    .hb-bottom .ic { position: relative; width: 16px; height: 16px; }
    .hb-bottom .ic img { position: absolute; inset: 0; width: 16px; height: 16px; transition: opacity .25s, transform .3s var(--spring); }
    .hb-bottom .ic .on { opacity: 0; transform: scale(.4) rotate(-45deg); }
    .hb.is-selected .hb-bottom .ic .off { opacity: 0; transform: scale(.4) rotate(45deg); }
    .hb.is-selected .hb-bottom .ic .on { opacity: 1; transform: none; }
    .hb-live .hb-headline { flex: 1; width: auto; padding: 6px; }
    .live-panel { height: 76px; background: var(--background-base); padding: 4px; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; justify-content: center; }
    .min-badge {
      height: 18px; display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 6px;
      background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .11); border-radius: 4px;
      font-size: 10px; font-weight: 500; color: var(--content-live);
    }
    .min-badge img { width: 8px; height: 8px; }
    .live-score { font-size: 12px; font-weight: 700; line-height: 1; letter-spacing: .3px; text-transform: uppercase; text-align: right; }

    /* ---------- Pre-made AKO cards ---------- */
    .ako-row { gap: 8px; align-items: center; padding: 12px 12px 0; scroll-padding-left: 12px; }
    .ako { width: 320px; height: 185px; border-radius: 8px; background: var(--background-base); border: 1px solid rgba(255, 255, 255, .1); overflow: hidden; }
    .ako-gradient { height: 100%; display: flex; flex-direction: column; justify-content: space-between; border-radius: 8px; background: linear-gradient(to right, rgba(255, 219, 1, 0), rgba(255, 219, 1, .1)); }
    .ako-rows { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .proof-row { display: flex; gap: 8px; align-items: center; }
    .proof { border: 1px solid var(--brand); border-radius: 4px; padding: 4px 6px 4px 4px; font-size: 10px; line-height: 10px; font-weight: 600; font-style: italic; letter-spacing: .3px; text-transform: uppercase; color: var(--brand); }
    .starts { font-size: 12px; letter-spacing: .3px; text-transform: uppercase; color: var(--content-secondary); }
    .title-row { display: flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; white-space: nowrap; }
    .ako-divider { margin-top: 8px; height: 1px; background: rgba(255, 255, 255, .1); }
    .ako-market { display: flex; gap: 8px; padding: 8px 12px 0; }
    .betbuild { width: 8px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; }
    .betbuild .dot { width: 4px; height: 4px; }
    .betbuild .line { flex: 1; width: 8px; }
    .selections { width: 264px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; letter-spacing: .3px; }
    .selections p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ako-btn-pad { padding: 6px; }
    .ako-odd {
      width: 100%; height: 47px; border-radius: 6px; background: var(--surface-action); border: 1px solid var(--surface-primary);
      font-size: 16px; font-weight: 700; letter-spacing: .3px; transition: background .2s, color .2s, transform .15s;
    }
    .ako-odd:active, .odd-mini:active, .odd:active, .odd-btn:active { transform: scale(.96); }
    .ako-odd.is-selected, .odd-mini.is-selected { background: var(--brand); color: #000; border-color: var(--brand); }

    .card-bb {
      position: relative; width: 320px; height: 168px; border-radius: 12px; overflow: hidden;
      background: linear-gradient(to top, var(--surface-secondary), var(--surface-primary));
      box-shadow: 0 4px 6px rgba(0, 0, 0, .1), 0 2px 4px -1px rgba(0, 0, 0, .06);
    }
    .card-bb .swoosh { position: absolute; left: 8.63px; bottom: .35px; width: 292.18px; height: 151.65px; }
    .bb-content { position: absolute; left: 12px; top: 16px; width: 292px; display: flex; flex-direction: column; gap: 4px; }
    .bb-title { position: relative; height: 20px; padding-left: 20px; font-size: 16px; font-weight: 700; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bb-title img { position: absolute; left: -3px; top: 2px; width: 16px; height: 16px; }
    .combos { width: 208px; display: flex; gap: 10px; align-items: center; }
    .stepper { width: 10px; display: flex; flex-direction: column; align-items: center; padding: 8px 0; }
    .stepper img { width: 8px; height: 8px; margin-bottom: -1px; }
    .stepper i { width: 2px; height: 34px; background: var(--brand); margin-bottom: -1px; }
    .legs { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
    .legs p { height: 32px; display: flex; align-items: center; font-size: 14px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .odd-mini {
      width: 76px; height: 40px; border-radius: 8px; background: var(--surface-action); border: 1px solid var(--surface-primary);
      font-size: 14px; font-weight: 700; text-transform: uppercase;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .1)) drop-shadow(0 2px 2px rgba(0, 0, 0, .06));
      transition: background .2s, color .2s, transform .15s;
    }
    .bb-content .odd-mini { position: absolute; right: -37px; bottom: 0; }
    .ako-plain { position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .ako-plain .copy { position: relative; height: 82px; display: flex; flex-direction: column; gap: 6px; }
    .ako-plain .copy h3 { margin: 0; text-indent: 24px; font-size: 16px; font-weight: 700; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .ako-plain .copy p { font-size: 14px; line-height: 16px; }
    .ako-plain .copy img { position: absolute; left: 0; top: 1px; width: 16px; height: 16px; }
    .odds-date { display: flex; justify-content: space-between; align-items: center; }
    .booster-col { height: 40px; display: flex; flex-direction: column; justify-content: space-between; }
    .booster { display: flex; align-items: flex-start; }
    .booster span { background: var(--brand); color: #000; border-radius: 4px; padding: 4px 6px; margin-right: -8px; font-size: 12px; font-weight: 500; line-height: 1; text-transform: uppercase; }
    .booster img { width: 31.06px; height: 17px; }
    .when { font-size: 12px; font-weight: 500; line-height: 18px; }
    .prev-odds { position: relative; height: 32px; padding: 4px 12px; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
    .prev-odds::after { content: ""; position: absolute; left: 9px; right: 9px; top: 50%; height: 1px; background: #fff; transform: rotate(-16.33deg); }
    .odds-pair-row { display: flex; gap: 4px; align-items: center; }

    /* ---------- Section title + layout switch ---------- */
    .section-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 0; }
    .section-head h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 20px; color: var(--content-secondary); }
    .layout-switch {
      position: relative; width: 30px; height: 30px; border-radius: 90px; background: var(--surface-primary);
      box-shadow: inset 0 4px 4px rgba(255, 255, 255, .26);
      display: grid; place-items: center; overflow: hidden;
      transition: transform .5s var(--spring), background .25s;
    }
    .layout-switch:hover { background: #45454f; }
    .layout-switch:active { transform: scale(.86); transition-duration: .12s; }
    .layout-switch .icon { position: absolute; left: 4.5px; top: 4.5px; width: 21px; height: 21px; transition: transform 1.02s var(--spring), opacity .35s ease; }
    .layout-switch .icon-expand { transform: none; opacity: 1; }
    .layout-switch .icon-collapse { transform: rotate(-90deg) scale(.3); opacity: 0; }
    .layout-switch[aria-pressed="true"] .icon-expand { transform: rotate(90deg) scale(.3); opacity: 0; }
    .layout-switch[aria-pressed="true"] .icon-collapse { transform: none; opacity: 1; }
    .layout-switch::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--brand);
      opacity: 0; transform: scale(.6); pointer-events: none;
    }
    .layout-switch.pulse::after { animation: ring .7s var(--ease-out); }
    @keyframes ring { 0% { opacity: .9; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.35); } }

    /* ---------- Sport chips ---------- */
    .chips { gap: 4px; padding: 12px 8px 8px; scroll-padding-left: 8px; }
    .chip {
      height: 32px; display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 30px;
      background: var(--surface-secondary); border: 1px solid var(--surface-primary);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .1), 0 1px 2px rgba(0, 0, 0, .06);
      font-size: 14px; font-weight: 500; letter-spacing: 1.3px; color: var(--content-secondary);
      transition: border-color .25s var(--ease-out), transform .15s;
    }
    .chip:active { transform: scale(.95); }
    .chip[aria-pressed="true"] { border-color: var(--brand); }
    .chip img { width: 16px; height: 16px; }

    /* ---------- Layout views ---------- */
    .views { position: relative; }
    .view[hidden] { display: none; }
    .anim-item { will-change: transform, opacity; }

    /* View A: compact list */
    .market-card { background: var(--surface-primary); border-radius: 10px 10px 0 0; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); padding: 0 12px; }
    .market-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--surface-secondary); }
    .market-left { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; padding-right: 12px; font-size: 14px; font-weight: 600; }
    .market-left #marketLabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filter-btn { width: 24px; height: 24px; border-radius: 8px; background: var(--surface-action); display: grid; place-items: center; transition: transform .15s, background .2s; }
    .filter-btn:hover { background: #686870; }
    .filter-btn:active { transform: scale(.9); }
    .filter-btn img { width: 12px; height: 12px; }
    .market-cols { flex: none; width: 143px; padding-right: 8px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
    /* Two-way markets: labels sit centred over the two odds columns (159 = odds area after the divider) */
    .market-cols.cols-2 { width: 159px; padding-right: 0; justify-content: stretch; }
    .market-cols.cols-2 span { flex: 1; text-align: center; }

    .league-head {
      width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px;
      background: var(--surface-secondary); font-size: 14px; text-align: left;
    }
    .league-head .chev { width: 16px; height: 16px; transition: transform .45s var(--spring); }
    .league[data-open="false"] .league-head .chev { transform: rotate(180deg); }
    .league-body { overflow: hidden; transition: height .45s var(--ease-out); }
    .rows { background: var(--surface-primary); box-shadow: 0 4px 14px rgba(0, 0, 0, .4); padding: 0 12px; }
    .row { height: 80px; display: flex; align-items: center; border-top: 1px solid var(--surface-secondary); }
    .row:first-child { border-top: 2px solid var(--surface-secondary); }
    .row-info { width: 184px; display: flex; flex-direction: column; gap: 4px; margin-right: 0; }
    .status { height: 21px; display: flex; align-items: center; gap: 6px; font-family: Inter, sans-serif; font-size: 11px; }
    .status.live { color: var(--content-live); font-weight: 600; }
    .status.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--content-live); animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .status.time { color: var(--content-secondary); }
    .status img { width: 16px; height: 16px; }
    .status .clock { width: 13px; height: 13px; }
    .teams { display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .team { display: flex; align-items: center; justify-content: space-between; height: 16px; font-size: 14px; font-weight: 600; }
    .team span:first-child { display: flex; align-items: center; gap: 8px; }
    .team img { width: 16px; height: 16px; }
    .row-odds { display: flex; align-items: center; width: 167px; height: 80px; }
    .row-odds .divider { width: 8px; height: 62px; border-right: 1px solid var(--surface-secondary); margin-right: 0; }
    .odd {
      position: relative; flex: 1; min-width: 0; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      font-size: 14px; font-weight: 700; transition: background .2s, color .2s, transform .15s;
    }
    .odd:hover:not(:disabled) { background: rgba(255, 255, 255, .05); }
    .odd.is-selected { background: var(--brand); color: #000; }
    .odd:disabled { cursor: not-allowed; }
    .odd img.lock { width: 16px; height: 16px; }
    .odd img.down { position: absolute; bottom: 12px; width: 12px; height: 9px; }

    /* View B: match cards */
    .leagues-b { display: flex; flex-direction: column; gap: 8px; }
    .league-b-head {
      width: 100%; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: var(--surface-primary);
    }
    .league-b-head .label { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; font-weight: 500; letter-spacing: .12px; }
    .league-b-head .label > img { width: 16px; height: 16px; }
    .icon-btn { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--content-secondary); transition: background .2s, color .2s, transform .15s; }
    .icon-btn:hover { background: rgba(255, 255, 255, .06); }
    .icon-btn:active { transform: scale(.88); }
    .icon-btn.is-on { color: var(--brand); }
    .icon-btn img, .icon-btn svg { width: 24px; height: 24px; }
    .icon-btn .chev-b { transition: transform .45s var(--spring); }
    .league-b[data-open="false"] .chev-b { transform: rotate(180deg); }
    .cards { display: flex; flex-direction: column; gap: 1px; }
    .match-card { background: linear-gradient(to bottom, var(--surface-secondary), var(--surface-primary)); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 8px 16px 4px; }
    .card-top.plain { padding: 8px 12px 4px 16px; align-items: flex-start; }
    .badges { display: flex; gap: 4px; align-items: center; }
    .badge { height: 18px; display: flex; align-items: center; padding: 4px 6px; border-radius: 4px; font-size: 10px; line-height: 10px; font-weight: 600; font-style: italic; letter-spacing: .3px; text-transform: uppercase; }
    .badge.outline { border: 1px solid var(--accent-lime); color: var(--accent-lime); }
    .match-meta { display: flex; flex-direction: column; gap: 8px; padding: 8px 16px; }
    .card-top.plain .match-meta { padding: 0; }
    .kick { font-size: 12px; font-weight: 600; letter-spacing: .3px; color: var(--content-secondary); }
    .vs { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; letter-spacing: .14px; }
    .vs span { display: flex; align-items: center; gap: 8px; }
    .vs img { width: 16px; height: 16px; }
    .markets { gap: 8px; padding: 8px 16px; scroll-padding-left: 16px; }
    .market { width: 327px; display: flex; flex-direction: column; gap: 4px; }
    .market > p { font-size: 12px; line-height: 14px; color: var(--content-secondary); }
    .odd-group { display: flex; gap: 4px; }
    .odd-btn {
      flex: 1; height: 40px; border-radius: 8px; background: var(--odd-surface); padding: 0 8px;
      display: flex; align-items: center; justify-content: space-between;
      transition: background .15s ease-out, color .15s, transform .15s;
    }
    .odd-btn:hover { background: var(--odd-surface-hover); }
    .odd-btn .sel { font-size: 12px; color: var(--content-secondary); }
    .odd-btn .val { font-size: 14px; font-weight: 700; }
    .odd-btn.is-selected { background: var(--brand); color: #000; }
    .odd-btn.is-selected .sel { color: #000; }
    .league-b-body { overflow: hidden; transition: height .45s var(--ease-out); }

    /* ---------- Bottom nav ---------- */
    .bottom-nav { position: absolute; inset: auto 0 0 0; z-index: 20; height: 48px; display: flex; background: #000; filter: drop-shadow(0 -2px 3px rgba(0, 0, 0, .05)); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 6px; font-size: 11px; line-height: 12px; letter-spacing: -.24px; color: var(--content-secondary); }
    .nav-item .ic { width: 32px; height: 32px; display: grid; place-items: center; margin-bottom: -2px; }
    .nav-item .ic img { width: 24px; height: 24px; }
    .nav-item[aria-current="page"] { color: var(--brand); font-weight: 600; }

    /* ---------- Filter bottom sheet ---------- */
    .scrim { position: absolute; inset: 0; z-index: 30; background: rgba(0, 0, 0, .65); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; max-height: calc(100% - 80px); overflow-y: auto;
      background: rgba(59, 59, 68, .97); border-radius: 12px 12px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 16px;
      transform: translateY(105%); transition: transform .45s var(--ease-out);
    }
    .sheet:focus { outline: none; }
    .sheet-open .scrim { opacity: 1; pointer-events: auto; }
    .sheet-open .sheet { transform: none; }
    .sheet-title { display: flex; align-items: center; gap: 8px; }
    .sheet-title h3 { flex: 1; margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -.2px; }
    .sheet-title button { padding: 4px; border-radius: 6px; }
    .sheet-title button img { width: 24px; height: 24px; }
    .sheet h4 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .07px; }
    .radio-list { display: flex; flex-direction: column; }
    .radio-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; text-align: left; font-size: 14px; line-height: 20px; letter-spacing: .07px; transition: background .15s; }
    .radio-item:hover { background: rgba(255, 255, 255, .05); }
    .radio-item .lead { width: 32px; height: 32px; display: grid; place-items: center; }
    .radio { position: relative; width: 16px; height: 16px; }
    .radio img { position: absolute; }
    .radio .surface { inset: 0; width: 16px; height: 16px; }
    .radio .dot { left: 4px; top: 4px; width: 8px; height: 8px; transform: scale(0); transition: transform .35s var(--spring); }
    .radio-item[aria-checked="true"] .dot { transform: scale(1); }
    .radio .surface.on { opacity: 0; }
    .radio-item[aria-checked="true"] .surface.on { opacity: 1; }
    .radio-item[aria-checked="true"] .surface.off { opacity: 0; }
    .sheet-footer { display: flex; gap: 16px; }
    .sheet-btn {
      flex: 1; min-width: 0; height: 40px; padding: 8px 12px; border-radius: 8px; border: 1px solid;
      font-size: 14px; font-weight: 700; text-transform: uppercase; white-space: nowrap;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .1)) drop-shadow(0 2px 2px rgba(0, 0, 0, .06));
      transition: background .2s, transform .15s;
    }
    .sheet-btn:active { transform: scale(.97); }
    .sheet-btn.secondary { background: var(--surface-action); border-color: var(--surface-primary); color: var(--content-primary); }
    .sheet-btn.secondary:hover { background: #66666e; }
    .sheet-btn.primary { background: var(--brand); border-color: var(--brand); color: #000; }
    .sheet-btn.primary:hover { background: #ffe233; }

    /* ---------- Toast ---------- */
    .toast {
      position: absolute; left: 50%; bottom: 64px; z-index: 40; transform: translate(-50%, 12px); opacity: 0;
      padding: 10px 14px; border-radius: 8px; background: #000; color: #fff; font-size: 13px; white-space: nowrap; pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .4); transition: opacity .25s, transform .35s var(--spring);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* ---------- Phone widths: thumb scrolling (kept last so it overrides the frame layout above) ---------- */
    @media (max-width: 440px) {
      /* Phones: the whole page scrolls with the thumb. Header stays pinned at the top,
         tab bar at the bottom; overlays are fixed to the screen. */
      html, body { height: auto; }
      .phone { height: auto; min-height: 100dvh; overflow: visible; }
      .top-header { position: sticky; top: 0; }
      .scroll { position: static; overflow: visible; padding: 11px 0 calc(64px + env(safe-area-inset-bottom, 0px)); }
      .bottom-nav { position: fixed; height: calc(48px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
      .scrim, .toast { position: fixed; }
      .sheet { position: fixed; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
      .toast { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    }
    html.lock-scroll { overflow: hidden; }
    /* ---------- Pull to refresh ---------- */
    .ptr {
      position: absolute; left: 50%; top: 74px; z-index: 19; width: 36px; height: 36px; margin: -44px 0 0 -18px;
      display: grid; place-items: center; border-radius: 50%; background: var(--surface-secondary, #2e2e38);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .45); pointer-events: none; opacity: 0;
      transform: translateY(var(--ptr-y, 0px));
    }
    .ptr svg { width: 22px; height: 22px; overflow: visible; }
    .ptr circle { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 50.3; transition: stroke-dashoffset .1s; }
    .ptr.armed { box-shadow: 0 0 0 2px rgba(255, 219, 1, .25), 0 4px 12px rgba(0, 0, 0, .45); }
    .ptr.refreshing svg { animation: ptr-spin .8s linear infinite; }
    .ptr.refreshing circle { stroke-dashoffset: 34 !important; }
    @keyframes ptr-spin { to { transform: rotate(360deg); } }
    .ptr.settle, .scroll.settle { transition: transform .45s var(--spring, cubic-bezier(.34, 1.4, .64, 1)), opacity .3s; }
    .scroll.pulling { user-select: none; -webkit-user-select: none; }
    @media (max-width: 440px) {
      /* Our own pull-to-refresh replaces the browser's reload gesture */
      html, body { overscroll-behavior-y: none; }
      .ptr { position: fixed; top: 74px; }
    }
  </style>
</head>
<body>

  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Toast ---------- */
    const toast = $('#toast');
    let toastTimer;
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    }
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-toast]');
      if (t) { e.preventDefault(); showToast(t.dataset.toast); }
      if (e.target.closest('[data-scroll-top]')) { e.preventDefault(); $('#scroll').scrollTo({ top: 0, behavior: 'smooth' }); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });

    /* ---------- Pre-made AKO cards ---------- */
    const footballEmoji = '<img src="assets/emoji-football.png" width="14" height="14" alt="">';
    const premade = () => `
      <article class="ako"><div class="ako-gradient">
        <div>
          <div class="ako-rows">
            <div class="proof-row"><span class="proof">🔥 453 bets</span><span class="starts">starts in 5h</span></div>
            <a class="title-row" href="#" data-toast="Match detail: FC Barcelona vs Real Madrid">${footballEmoji}<span>FC Barcelona</span><span>—</span><span>Real Madrid</span><img src="assets/ic-next.svg" width="12" height="12" alt=""></a>
          </div>
          <div class="ako-divider"></div>
          <div class="ako-market">
            <div class="betbuild" aria-hidden="true"><img class="dot" src="assets/betbuild-dot.svg" alt=""><img class="line" src="assets/betbuild-line.svg" alt=""><img class="line" src="assets/betbuild-line.svg" alt=""></div>
            <div class="selections"><p>Hugo Ekitike will score a goal</p><p>Mohamed Salah will have 1+ assists</p><p>Over 5.5 Liverpool corners</p></div>
          </div>
        </div>
        <div class="ako-btn-pad"><button class="ako-odd" type="button" aria-pressed="false" data-select>1.30</button></div>
      </div></article>`;
    const precanned = (title, legs, odd) => `
      <article class="card-bb"><img class="swoosh" src="assets/ako-swoosh.svg" alt="">
        <div class="bb-content">
          <p class="bb-title"><img src="assets/cic-football.svg" alt="">${title}</p>
          <div class="combos">
            <div class="stepper" aria-hidden="true">${legs.map((_, i) => (i ? '<i></i>' : '') + '<img src="assets/stepper-circle.svg" alt="">').join('')}</div>
            <div class="legs" style="height:112px">${legs.map(l => `<p>${l}</p>`).join('')}</div>
          </div>
          <button class="odd-mini" type="button" aria-pressed="false" data-select>${odd}</button>
        </div>
      </article>`;
    const plainAko = () => `
      <article class="card-bb"><img class="swoosh" src="assets/ako-swoosh.svg" alt="">
        <div class="ako-plain">
          <div class="copy"><img src="assets/cic-football.svg" alt=""><h3>Atl.Madrid, Real Madrid - každý tým bude zahrávat alespoň dva rohové kopy v každém poločasu</h3><p>Ano</p></div>
          <div class="odds-date">
            <div class="booster-col"><div class="booster"><span>Navýšený kurz</span><img src="assets/boost-arrows.svg" alt=""></div><p class="when">Dnes 20:00</p></div>
            <div class="odds-pair-row"><span class="prev-odds" aria-label="Previous odds 4.35">4.35</span><button class="odd-mini" type="button" aria-pressed="false" data-select>5.30</button></div>
          </div>
        </div>
      </article>`;
    $('#akoRow').innerHTML = premade() + premade()
      + precanned('Atletico Madrid - Real Madrid', ['Atletico Madrid vyhraje', 'Álvaro Morata dá gól'], '4.20')
      + plainAko()
      + precanned('AC Milan - Paris Saint-Germain', ['AC Milan vyhraje', 'Kylian Mbappe dá gól', 'Více než 3.5 gólů'], '3.25');

    /* ---------- View A: compact list ---------- */
    const kit = t => `<img src="assets/kit-${t}.png" alt="">`;
    const odd = (v, mod = '') => mod === 'lock'
      ? `<button class="odd" type="button" disabled aria-label="Odds suspended"><img class="lock" src="assets/ic-lock.svg" alt=""></button>`
      : `<button class="odd" type="button" aria-pressed="false" data-select>${v}</button>`;
    const row = ({ live, odds }) => `
      <div class="row">
        <div class="row-info">
          ${live
            ? '<div class="status live"><i></i><span>LIVE 97:05</span><img src="assets/ic-live-stream.svg" alt="Live stream available"></div>'
            : '<div class="status time"><img class="clock" src="assets/ic-clock.svg" alt=""><span>Sat 15:30</span></div>'}
          <div class="teams">
            <div class="team"><span>${kit('arsenal')}Arsenal</span>${live ? '<span>0</span>' : ''}</div>
            <div class="team"><span>${kit('napoli')}Napoli</span>${live ? '<span>0</span>' : ''}</div>
          </div>
        </div>
        <div class="row-odds"><span class="divider"></span>${odds}</div>
      </div>`;
    /* Markets the filter can switch to. Each sets the header columns and the odds per row;
       a trailing "d" marks a dropping price. Row 2 is suspended in every market. */
    const MARKETS = {
      'Match Winner':              { cols: ['1', 'X', '2'],       odds: [['2.37', '2.37', '2.37'], ['2.37', '2.37d', '2.37']] },
      'Exact score':               { cols: ['1:0', '0:0', '0:1'], odds: [['7.50', '9.00', '11.0'], ['6.80', '8.50d', '12.0']] },
      'Corners':                   { cols: ['Over', 'Under'],     odds: [['1.90', '1.90'], ['1.83', '1.97d']] },
      'Handicap':                  { cols: ['1', '2'],            odds: [['1.95', '1.85'], ['2.05d', '1.75']] },
      'Both Teams to Score (1.5)': { cols: ['Over', 'Under'],     odds: [['1.85', '1.95'], ['2.10d', '1.72']] },
      'Yellow cards':              { cols: ['Over', 'Under'],     odds: [['1.80', '2.00'], ['1.76', '2.05d']] },
      'Red cards':                 { cols: ['Over', 'Under'],     odds: [['3.40', '1.30'], ['3.25d', '1.33']] }
    };
    const oddsFor = values => values.map(v => v.endsWith('d') ? odd(v.slice(0, -1), 'down') : odd(v)).join('');
    const rowOdds = (m, i) => i === 1
      ? m.cols.map(() => odd('', 'lock')).join('')
      : oddsFor(m.odds[i === 0 ? 0 : 1]);
    const rowsFor = name => {
      const m = MARKETS[name];
      return [
        row({ live: true, odds: rowOdds(m, 0) }),
        row({ live: true, odds: rowOdds(m, 1) }),
        row({ live: false, odds: rowOdds(m, 2) })
      ].join('');
    };
    const colsFor = name => MARKETS[name].cols.map(c => `<span>${c}</span>`).join('');
    const rowsA = rowsFor('Match Winner');
    const leagueA = (name, open) => `
      <section class="league anim-item" data-open="${open}">
        <button class="league-head" type="button" aria-expanded="${open}"><span>${name}</span><img class="chev" src="assets/ic-chevron-down.svg" alt=""></button>
        <div class="league-body" ${open ? '' : 'style="height:0"'}><div class="rows">${rowsA}</div></div>
      </section>`;
    $('#viewList').innerHTML = `
      <div class="market-card anim-item">
        <div class="market-head">
          <div class="market-left"><button class="filter-btn" type="button" id="openFilter" aria-label="Filter markets" aria-haspopup="dialog"><img src="assets/ic-market-filter.svg" alt=""></button><span id="marketLabel">Match Winner</span></div>
          <div class="market-cols" id="marketCols">${colsFor('Match Winner')}</div>
        </div>
      </div>
      ${leagueA('England Premier League', true)}${leagueA('England Premier League', true)}${leagueA('England Premier League', false)}`;

    /* ---------- View B: match cards ---------- */
    const starSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M10.7839 4.74886C11.2338 3.66704 12.7663 3.66705 13.2163 4.74886L14.7379 8.40726C14.7656 8.47381 14.8282 8.51928 14.9 8.52504L18.8496 8.84168C20.0175 8.93531 20.491 10.3928 19.6012 11.155L16.5921 13.7327C16.5373 13.7796 16.5134 13.8532 16.5301 13.9233L17.4495 17.7774C17.7213 18.917 16.4815 19.8178 15.4816 19.2071L12.1003 17.1418C12.0387 17.1042 11.9614 17.1042 11.8999 17.1418L8.51851 19.2071C7.51861 19.8178 6.27879 18.917 6.55064 17.7774L7.46999 13.9233C7.48671 13.8532 7.4628 13.7796 7.40806 13.7327L4.39892 11.155C3.5091 10.3928 3.98267 8.93531 5.15058 8.84168L9.10013 8.52504C9.17198 8.51928 9.23456 8.47381 9.26224 8.40726L10.7839 4.74886ZM12.1775 5.1809C12.1119 5.02303 11.8883 5.02304 11.8226 5.1809L10.301 8.8393C10.1113 9.29536 9.68239 9.60697 9.19003 9.64644L5.24048 9.96308C5.07006 9.97674 5.00095 10.1894 5.1308 10.3006L8.13994 12.8783C8.51507 13.1996 8.67889 13.7038 8.56428 14.1843L7.64494 18.0384C7.60527 18.2047 7.78619 18.3361 7.9321 18.247L11.3135 16.1817C11.735 15.9242 12.2651 15.9242 12.6867 16.1817L16.068 18.247C16.2139 18.3361 16.3949 18.2047 16.3552 18.0384L15.4358 14.1843C15.3212 13.7038 15.4851 13.1996 15.8602 12.8783L18.8693 10.3006C18.9992 10.1894 18.9301 9.97674 18.7596 9.96308L14.8101 9.64644C14.3177 9.60697 13.8888 9.29536 13.6992 8.8393L12.1775 5.1809Z"/></svg>';
    const pinSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M15.4023 6.58514L17.4189 8.60174C18.056 9.2389 17.5157 10.321 16.624 10.1936L16.108 10.1199L13.4036 12.8238L13.3978 13.0483L13.3958 13.1079C13.3943 13.1484 13.3919 13.2082 13.3881 13.2843C13.3806 13.4364 13.3678 13.6526 13.3468 13.9065C13.3044 14.4179 13.2298 15.0673 13.1022 15.6515C13.0384 15.9436 12.9638 16.2075 12.8787 16.4241C12.7908 16.6479 12.7059 16.7842 12.6399 16.8535C12.626 16.8681 12.6157 16.8772 12.6086 16.8827C12.5777 16.8723 12.4908 16.8325 12.3456 16.6873C10.5791 14.9209 9.92916 14.2448 9.80117 14.1107C9.77602 14.0843 9.75127 14.0598 9.72588 14.0359C9.60958 13.9261 9.05055 13.3922 7.31726 11.6589C7.17481 11.5165 7.13482 11.4307 7.12398 11.3995C7.12954 11.3925 7.13862 11.3823 7.153 11.3686C7.22273 11.3024 7.35935 11.2174 7.58325 11.1294C7.80007 11.0442 8.064 10.9695 8.35607 10.9056C8.94018 10.7777 9.58919 10.7027 10.1003 10.6599C10.354 10.6387 10.5701 10.6257 10.7221 10.618C10.7981 10.6142 10.8579 10.6117 10.8983 10.6102L11.1817 10.6022L13.8861 7.89877L13.8121 7.38129C13.6847 6.4892 14.7653 5.94816 15.4023 6.58514ZM14.5113 13.34L14.513 13.3054L16.5056 11.3132C18.4431 11.5552 19.6058 9.19772 18.2138 7.80565L16.1972 5.78904C14.8054 4.39732 12.4511 5.56173 12.6935 7.50023L10.7007 9.49228L10.6656 9.49401C10.5035 9.50217 10.2748 9.51593 10.0066 9.53838C9.47356 9.58298 8.76911 9.66308 8.11567 9.80618C7.78896 9.87772 7.46309 9.96755 7.17224 10.0818C6.88848 10.1933 6.59958 10.3428 6.37909 10.5521C6.14702 10.7724 5.96344 11.09 6.00033 11.4898C6.0344 11.8591 6.24786 12.1805 6.52238 12.455C7.6754 13.608 8.3132 14.2348 8.6491 14.5611L5.18162 18.0291C4.9618 18.249 4.96156 18.6052 5.18109 18.8246C5.40061 19.0441 5.75676 19.0438 5.97658 18.824L9.44277 15.3572C9.83172 15.7551 10.4921 16.4248 11.5507 17.4834C11.8258 17.7585 12.1472 17.972 12.5159 18.0068C12.9153 18.0444 13.2334 17.8619 13.4544 17.6295C13.6642 17.409 13.8138 17.1198 13.9253 16.8359C14.0397 16.5449 14.1294 16.2187 14.2008 15.8918C14.3436 15.238 14.4233 14.533 14.4675 13.9995C14.4897 13.731 14.5033 13.5022 14.5113 13.34Z"/></svg>';
    const iconBtn = (src, label, extra = '') => `<button class="icon-btn" type="button" aria-label="${label}" ${extra}><img src="assets/${src}" alt=""></button>`;
    const market = () => `<div class="market"><p>Market name</p><div class="odd-group">${[1, 1, 1].map(() => `<button class="odd-btn" type="button" aria-pressed="false" data-select><span class="sel">1</span><span class="val">0.00</span></button>`).join('')}</div></div>`;
    const teamsB = `<div class="vs"><span>${kit('benfica')}SL Benfica</span>-<span>FC Porto${kit('porto')}</span></div>`;
    const star = `<button class="icon-btn" type="button" aria-label="Add to favourites" aria-pressed="false" data-fav>${starSvg}</button>`;
    const card = badges => badges
      ? `<article class="match-card">
          <div class="card-top"><div class="badges">${badges.map(b => `<span class="badge outline">${b}</span>`).join('')}</div>${star}</div>
          <div class="match-meta"><p class="kick">Tomorrow 15:30</p>${teamsB}</div>
          <div class="h-scroll markets">${market()}${market()}${market()}</div>
        </article>`
      : `<article class="match-card">
          <div class="card-top plain"><div class="match-meta"><p class="kick">Tomorrow 15:30</p>${teamsB}</div>${star}</div>
          <div class="h-scroll markets">${market()}${market()}${market()}</div>
        </article>`;
    const leagueB = (name, cards) => `
      <section class="league-b anim-item" data-open="true">
        <div class="league-b-head">
          <div class="label"><img src="assets/cic-football.svg" alt=""><span>${name}</span><button class="icon-btn" type="button" aria-label="Pin ${name}" aria-pressed="false" data-pin>${pinSvg}</button></div>
          ${iconBtn('ic-chart.svg', 'Statistics', 'data-toast="Statistics for ' + name + '"')}
          ${iconBtn('ic-info.svg', 'League info', 'data-toast="About ' + name + '"')}
          <button class="icon-btn" type="button" aria-label="Collapse ${name}" aria-expanded="true" data-collapse-b><img class="chev-b" src="assets/ic-up.svg" alt=""></button>
        </div>
        <div class="league-b-body"><div class="cards">${cards.map(card).join('')}</div></div>
      </section>`;
    $('#viewCards').innerHTML = `<div class="leagues-b">
      ${leagueB('Premier League', [['+2', 'VAR'], ['+90'], null])}
      ${leagueB('Bundesliga', [null, null])}
      ${leagueB('Bundesliga 2nd', [['+2', 'VAR']])}
    </div>`;

    /* ---------- Selections ---------- */
    document.addEventListener('click', e => {
      const sel = e.target.closest('[data-select]');
      if (sel && !sel.disabled) {
        const on = !sel.classList.contains('is-selected');
        sel.classList.toggle('is-selected', on);
        sel.setAttribute('aria-pressed', on);
        if (!reduceMotion()) sel.animate([{ transform: 'scale(.92)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' });
        showToast(on ? 'Added to your betslip' : 'Removed from your betslip');
      }
      const hb = e.target.closest('[data-betslip]');
      if (hb) {
        const on = hb.getAttribute('aria-pressed') !== 'true';
        hb.setAttribute('aria-pressed', on);
        hb.classList.toggle('is-selected', on);
        $('.label', hb).textContent = on ? 'Added to your betslip' : 'Add to your betslip';
      }
      const fav = e.target.closest('[data-fav], [data-pin]');
      if (fav) {
        const on = fav.getAttribute('aria-pressed') !== 'true';
        fav.setAttribute('aria-pressed', on);
        fav.classList.toggle('is-on', on);
        if (!reduceMotion()) fav.animate([{ transform: 'scale(.7) rotate(-12deg)' }, { transform: 'scale(1)' }], { duration: 500, easing: 'cubic-bezier(.34,1.56,.64,1)' });
      }
    });

    /* ---------- Chips ---------- */
    $('#chips').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      $$('.chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
      chip.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
    });

    /* ---------- Collapsible leagues (both layouts) ---------- */
    function toggleHeight(body, open) {
      const from = body.getBoundingClientRect().height;
      body.style.height = 'auto';
      const to = open ? body.scrollHeight : 0;
      body.style.height = from + 'px';
      body.getBoundingClientRect();
      body.style.height = to + 'px';
      clearTimeout(body._t);
      // Timer rather than transitionend: child transitions bubble and would end this early
      body._t = setTimeout(() => { if (open) body.style.height = 'auto'; }, reduceMotion() ? 0 : 470);
    }
    document.addEventListener('click', e => {
      const head = e.target.closest('.league-head');
      if (head) {
        const league = head.closest('.league');
        const open = league.dataset.open !== 'true';
        league.dataset.open = open; head.setAttribute('aria-expanded', open);
        toggleHeight($('.league-body', league), open);
      }
      const btn = e.target.closest('[data-collapse-b]');
      if (btn) {
        const league = btn.closest('.league-b');
        const open = league.dataset.open !== 'true';
        league.dataset.open = open; btn.setAttribute('aria-expanded', open);
        btn.setAttribute('aria-label', (open ? 'Collapse ' : 'Expand ') + $('.label span', league).textContent);
        toggleHeight($('.league-b-body', league), open);
      }
    });

    /* ---------- Layout switch: the animated button ---------- */
    const switchBtn = $('#layoutSwitch');
    const views = $('#views');
    const viewList = $('#viewList');
    const viewCards = $('#viewCards');
    let busy = false;
    // Sequencing runs on timers matched to the animation durations, so a paused or
    // throttled tab can never leave the switch half done
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function switchLayout() {
      if (busy) return;
      busy = true;
      const toCards = switchBtn.getAttribute('aria-pressed') !== 'true';
      const from = toCards ? viewList : viewCards;
      const to = toCards ? viewCards : viewList;

      // 1. Button: icon morph (Figma smart animate, "Gentle" spring, ~1.02s) and a ring pulse
      switchBtn.setAttribute('aria-pressed', toCards);
      switchBtn.setAttribute('aria-label', toCards ? 'Switch to compact list' : 'Switch to expanded match cards');
      switchBtn.classList.remove('pulse'); void switchBtn.offsetWidth; switchBtn.classList.add('pulse');

      if (reduceMotion()) {
        from.hidden = true; to.hidden = false; busy = false;
        return;
      }

      // 2. Old layout leaves: items lift and fade with a small stagger
      const startH = views.getBoundingClientRect().height;
      views.style.height = startH + 'px';
      views.style.overflow = 'hidden';
      const outItems = $$('.anim-item', from);
      outItems.forEach((el, i) => el.animate(
        [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-10px) scale(.985)' }],
        { duration: 220, delay: i * 35, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }));
      await wait(220 + (outItems.length - 1) * 35);

      // 3. Swap, then morph the container height to the new layout
      from.hidden = true;
      outItems.forEach(el => el.getAnimations().forEach(a => a.cancel()));
      to.hidden = false;
      const endH = to.getBoundingClientRect().height;
      const heightAnim = views.animate([{ height: startH + 'px' }, { height: endH + 'px' }],
        { duration: 650, easing: 'cubic-bezier(.22,1,.36,1)' });

      // 4. New layout enters: items rise in with a spring and stagger
      const inItems = $$('.anim-item', to);
      inItems.forEach((el, i) => el.animate(
        [{ opacity: 0, transform: 'translateY(24px) scale(.97)' }, { opacity: 1, transform: 'none' }],
        { duration: 700, delay: 60 + i * 70, easing: 'cubic-bezier(.34,1.4,.64,1)', fill: 'backwards' }));

      await wait(650);
      views.style.height = ''; views.style.overflow = '';
      heightAnim.cancel();
      busy = false;
    }
    switchBtn.addEventListener('click', switchLayout);

    /* ---------- Filter bottom sheet ---------- */
    const phone = $('#phone');
    const sheet = $('#sheet');
    const groups = {
      // -1 = nothing picked, so the list shows Match Winner until a market is chosen
      market: { items: ['Exact score', 'Corners', 'Handicap', 'Both Teams to Score (1.5)', 'Yellow cards', 'Red cards'], value: -1, defaultValue: -1 },
      status: { items: ['Both Pre Match and Live', 'Pre Match', 'Live'], value: 0, defaultValue: 0 }
    };
    function renderRadios() {
      $$('.radio-list', sheet).forEach(list => {
        const g = groups[list.dataset.group];
        list.innerHTML = g.items.map((label, i) => `
          <button class="radio-item" type="button" role="radio" aria-checked="${i === g.value}" data-index="${i}">
            <span class="lead"><span class="radio"><img class="surface off" src="assets/radio-off.svg" alt=""><img class="surface on" src="assets/radio-on-surface-2.svg" alt=""><img class="dot" src="assets/radio-dot.svg" alt=""></span></span>
            <span>${label}</span>
          </button>`).join('');
      });
    }
    renderRadios();
    sheet.addEventListener('click', e => {
      const item = e.target.closest('.radio-item');
      if (!item) return;
      const list = item.closest('.radio-list');
      // Choices stay pending until Apply filter is pressed
      groups[list.dataset.group].value = +item.dataset.index;
      $$('.radio-item', list).forEach(r => r.setAttribute('aria-checked', r === item));
    });

    /* ---------- Market change: swap the table columns and odds ---------- */
    let currentMarket = 'Match Winner';
    function applyMarket(name) {
      if (name === currentMarket) return;
      currentMarket = name;
      const m = MARKETS[name];
      const label = $('#marketLabel'), cols = $('#marketCols');
      const rowSets = $$('#viewList .rows');
      const swap = () => {
        label.textContent = name;
        cols.innerHTML = colsFor(name);
        cols.classList.toggle('cols-2', m.cols.length === 2);
        rowSets.forEach(r => { r.innerHTML = rowsFor(name); });
      };
      // If the list isn't on screen (card layout), just update it
      if (reduceMotion() || viewList.hidden) { swap(); return; }
      const outEls = [label, cols, ...$$('#viewList .row-odds')];
      outEls.forEach(el => el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }],
        { duration: 160, easing: 'ease-in', fill: 'forwards' }));
      setTimeout(() => {
        outEls.forEach(el => el.getAnimations().forEach(a => a.cancel()));
        swap();
        const inEls = [label, cols, ...$$('#viewList .row-odds')];
        inEls.forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
          { duration: 520, delay: i * 45, easing: 'cubic-bezier(.34,1.4,.64,1)', fill: 'backwards' }));
      }, 170);
      showToast('Showing ' + name);
    }
    // What the table currently shows; the radios edit a pending copy until Apply filter
    Object.values(groups).forEach(g => { g.applied = g.value; });
    function openSheet() {
      Object.values(groups).forEach(g => { g.value = g.applied; });
      renderRadios();
      phone.classList.add('sheet-open'); document.documentElement.classList.add('lock-scroll');
      sheet.setAttribute('aria-hidden', 'false'); sheet.focus({ preventScroll: true });
    }
    // Closing with the cross, the scrim or Escape discards pending choices
    function closeSheet() {
      phone.classList.remove('sheet-open'); document.documentElement.classList.remove('lock-scroll');
      sheet.setAttribute('aria-hidden', 'true');
      $('#openFilter').focus({ preventScroll: true });
    }
    function applyFilters() {
      Object.values(groups).forEach(g => { g.applied = g.value; });
      closeSheet();
      const m = groups.market.applied;
      setTimeout(() => applyMarket(m < 0 ? 'Match Winner' : groups.market.items[m]), reduceMotion() ? 0 : 300);
    }
    $('#applyFilters').addEventListener('click', applyFilters);
    $('#openFilter').addEventListener('click', openSheet);
    $('#sheetClose').addEventListener('click', closeSheet);
    $('#scrim').addEventListener('click', closeSheet);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && phone.classList.contains('sheet-open')) closeSheet(); });
    /* Deep links for sharing a state: #cards starts in the card layout, #filter opens the sheet */
    if (location.hash.includes('cards')) {
      viewList.hidden = true; viewCards.hidden = false;
      switchBtn.setAttribute('aria-pressed', 'true');
      switchBtn.setAttribute('aria-label', 'Switch to compact list');
    }
    if (location.hash.includes('filter')) openSheet();

    // Clear selection resets the choices in the sheet; Apply filter then puts the table back to Match Winner
    $('#clearFilters').addEventListener('click', () => {
      Object.values(groups).forEach(g => g.value = g.defaultValue);
      renderRadios();
      showToast('Selection cleared');
    });
    /* ---------- Pull to refresh ---------- */
    (() => {
      const scroller = $('#scroll'), ptr = $('#ptr'), ring = $('#ptr circle');
      const THRESHOLD = 64, HOLD = 56, MAX = 120, RING = 50.3;
      let startX = 0, startY = 0, pull = 0, state = 'idle', pointerId = null, swallowClick = false;
      const atTop = () => scroller.scrollTop <= 0 && window.scrollY <= 0;
      const blocked = () => document.documentElement.classList.contains('lock-scroll');
      // Rubber-band resistance: tracks the finger at first, then gets heavier
      const resist = dy => MAX * (1 - Math.exp(-dy / (MAX * 1.5)));

      function paint(y, settle) {
        scroller.classList.toggle('settle', !!settle); ptr.classList.toggle('settle', !!settle);
        scroller.style.transform = y ? `translateY(${y}px)` : '';
        ptr.style.setProperty('--ptr-y', `${y}px`);
        ptr.style.opacity = y ? Math.min(1, y / 32) : 0;
        if (state === 'pulling') {
          const p = Math.min(1, y / THRESHOLD);
          ring.style.strokeDashoffset = RING * (1 - p * .8);
          ptr.querySelector('svg').style.transform = `rotate(${y * 4}deg)`;
          ptr.classList.toggle('armed', y >= THRESHOLD);
        }
      }

      function begin(x, y) {
        if (state !== 'idle' || blocked() || !atTop()) return false;
        startX = x; startY = y; pull = 0; state = 'maybe'; return true;
      }
      // Returns true while this gesture is a pull (so the caller can stop native scrolling)
      function move(x, y) {
        if (state === 'maybe') {
          const dx = x - startX, dy = y - startY;
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return false;
          if (dy <= 0 || Math.abs(dx) > Math.abs(dy) || !atTop()) { state = 'idle'; return false; }
          state = 'pulling'; scroller.classList.add('pulling');
        }
        if (state !== 'pulling') return false;
        pull = resist(Math.max(0, y - startY));
        paint(pull);
        return true;
      }
      function end() {
        if (state === 'maybe') { state = 'idle'; return; }
        if (state !== 'pulling') return;
        scroller.classList.remove('pulling');
        swallowClick = pull > 6;
        if (pull >= THRESHOLD) refresh();
        else { state = 'idle'; paint(0, true); }
      }

      function refresh() {
        state = 'refreshing';
        ptr.classList.remove('armed'); ptr.classList.add('refreshing');
        ptr.querySelector('svg').style.transform = '';
        paint(HOLD, true);
        setTimeout(() => {
          updateOdds();
          ptr.classList.remove('refreshing');
          state = 'idle';
          paint(0, true);
          showToast('Odds updated');
        }, reduceMotion() ? 600 : 1200);
      }

      // Fake a feed update: nudge a handful of prices and tick the live clocks on a minute
      function updateOdds() {
        const odds = $$('.odd[data-select], .odd-mini[data-select]', scroller).filter(b => !b.disabled);
        odds.forEach(b => {
          if (Math.random() > .3) return;
          const text = [...b.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.nodeValue));
          if (!text) return;
          const old = parseFloat(text.nodeValue);
          const up = Math.random() > .5;
          const step = Math.max(.05, Math.round(old * (.03 + Math.random() * .07) * 20) / 20);
          const next = Math.max(1.01, up ? old + step : old - step);
          text.nodeValue = next.toFixed(2);
          if (reduceMotion()) return;
          const c = up ? '60, 207, 110' : '255, 92, 92';
          b.animate([
            { boxShadow: `inset 0 0 0 1.5px rgb(${c})`, color: `rgb(${c})` },
            { boxShadow: `inset 0 0 0 1.5px rgba(${c}, 0)` }
          ], { duration: 1800, easing: 'ease-out' });
        });
        $$('.status.live span', scroller).forEach(s => {
          s.textContent = s.textContent.replace(/(\d+):(\d\d)/, (_, m, sec) => `${+m + 1}:${sec}`);
        });
      }

      // Touch: thumb pull on phones
      scroller.addEventListener('touchstart', e => { if (e.touches.length === 1) begin(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      scroller.addEventListener('touchmove', e => { if (move(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault(); }, { passive: false });
      scroller.addEventListener('touchend', end);
      scroller.addEventListener('touchcancel', end);
      // Mouse: click-and-drag down from the top to try it on desktop
      scroller.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 0 && begin(e.clientX, e.clientY)) pointerId = e.pointerId; });
      window.addEventListener('pointermove', e => { if (e.pointerId === pointerId && move(e.clientX, e.clientY)) e.preventDefault(); });
      window.addEventListener('pointerup', e => { if (e.pointerId === pointerId) { pointerId = null; end(); } });
      // A drag that became a pull shouldn't also press the odds button it started on
      scroller.addEventListener('click', e => { if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);
      scroller.addEventListener('pointerdown', () => { swallowClick = false; }, true);
    })();
  </script>
</body>
</html>
